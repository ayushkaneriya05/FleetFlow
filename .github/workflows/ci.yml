name: FleetFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetflow_test
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Migrations
        env:
          DB_NAME: fleetflow_test
          DB_USER: fleetflow
          DB_PASSWORD: fleetflow
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py migrate

      - name: Run Tests
        env:
          DB_NAME: fleetflow_test
          DB_USER: fleetflow
          DB_PASSWORD: fleetflow
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py test --verbosity=2
